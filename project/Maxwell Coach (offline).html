document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div id=\"mx-report\" style=\"width:100%;background:#fff;color:#040404;font-family:var(--font-sans)\">\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:14px;border-bottom:2px solid #040404\">\n    <div style=\"display:flex;flex-direction:column;gap:4px\">\n      <span style=\"font:700 10px var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:#800020\">Maxwell Coach · UP QROO<\u002Fspan>\n      <span style=\"font:800 26px/1.1 var(--font-sans);letter-spacing:-0.02em\">Reporte de liderazgo académico<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:2px;text-align:right\">\n      <span style=\"font:800 16px var(--font-sans)\">{{ rep.name }}<\u002Fspan>\n      <span style=\"font:500 12px var(--font-sans);color:#5a5a5a\">{{ rep.date }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding:16px 0 18px\">\n    <sc-for list=\"{{ rep.bars }}\" as=\"b\" hint-placeholder-count=\"4\">\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:6px\">\n          <span style=\"font:700 11px var(--font-sans)\">{{ b.name }}<\u002Fspan>\n          <span style=\"font:800 14px var(--font-sans)\">{{ b.pct }}%<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"display:block;height:6px;border-radius:999px;background:#E6E6E6;overflow:hidden\"><span style=\"display:block;height:100%;width:{{ b.pct }}%;background:{{ b.color }}\"><\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:18px\">\n    <sc-for list=\"{{ rep.blocks }}\" as=\"k\" hint-placeholder-count=\"2\">\n      <div style=\"border:1px solid #E6E6E6;border-radius:18px;overflow:hidden;break-inside:avoid;page-break-inside:avoid\">\n        <div style=\"background:{{ k.color }};color:{{ k.fg }};padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font:700 10px var(--font-sans);letter-spacing:.12em;text-transform:uppercase\">{{ k.label }}<\u002Fspan>\n            <span style=\"font:800 24px/1.1 var(--font-sans);letter-spacing:-0.02em\">{{ k.name }}<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"font:800 44px/1 var(--font-sans);letter-spacing:-0.03em\">{{ k.pct }}%<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:18px 22px 20px;display:flex;flex-direction:column;gap:16px\">\n          <p style=\"margin:0;font:600 13px/1.5 var(--font-sans)\">{{ k.text }}<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px\">\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <span style=\"font:700 10px var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:#800020\">Fortalezas<\u002Fspan>\n              <sc-for list=\"{{ k.strengths }}\" as=\"it\" hint-placeholder-count=\"3\">\n                <span style=\"font:500 12.5px/1.4 var(--font-sans)\">{{ it.t }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <span style=\"font:700 10px var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:#800020\">Puntos ciegos<\u002Fspan>\n              <sc-for list=\"{{ k.blind }}\" as=\"it\" hint-placeholder-count=\"2\">\n                <span style=\"font:500 12.5px/1.4 var(--font-sans)\">{{ it.t }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#FFF1EA;border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font:700 10px var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:#800020\">Consejo de tu coach<\u002Fspan>\n            <span style=\"font:600 13px/1.45 var(--font-sans)\">{{ k.tip }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startScreen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;welcome&quot;,&quot;quiz&quot;,&quot;profile&quot;],&quot;default&quot;:&quot;welcome&quot;,&quot;tsType&quot;:&quot;'welcome'|'quiz'|'profile'&quot;,&quot;section&quot;:&quot;Prototipo&quot;},&quot;colorCards&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Cuestionario&quot;},&quot;showTimer&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Cuestionario&quot;},&quot;sheetsUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Registro grupal&quot;},&quot;facilitatorPin&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2026&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Registro grupal&quot;}}\">\nconst STYLES = [\n  { key: 'rojo', name: 'Rojo Directivo', short: 'Directivo', color: '#C62828', ink: '#C62828', fg: '#FFFFFF', chip: 'rgba(0,0,0,.18)',\n    tagline: 'Marcas el rumbo y movilizas al equipo hacia resultados.',\n    summary: n => `${n} asume la conducción con naturalidad: define metas claras, decide con rapidez y sostiene el ritmo cuando un proyecto académico se complica.`,\n    strengths: ['Claridad en metas y prioridades', 'Decisión ante la incertidumbre', 'Capacidad para destrabar proyectos'],\n    blind: ['Puede avanzar sin escuchar a todos los involucrados', 'La urgencia puede percibirse como presión'],\n    tip: 'Antes de tu próxima decisión importante, pide su punto de vista a dos docentes y explica al equipo el porqué, no solo el qué.' },\n  { key: 'amarillo', name: 'Amarillo Innovador', short: 'Innovador', color: '#F2A100', ink: '#B87A00', fg: '#040404', chip: 'rgba(0,0,0,.10)',\n    tagline: 'Imaginas nuevas posibilidades y contagias entusiasmo.',\n    summary: n => `${n} piensa en el futuro del programa, propone formas distintas de enseñar y reúne al equipo alrededor de ideas nuevas.`,\n    strengths: ['Visión de largo plazo', 'Creatividad para resolver problemas', 'Energía que motiva al equipo'],\n    blind: ['Puede iniciar más proyectos de los que concluye', 'Los detalles operativos quedan en segundo plano'],\n    tip: 'Elige una sola iniciativa para este semestre y asígnale un responsable y una fecha de cierre.' },\n  { key: 'verde', name: 'Verde Empoderador', short: 'Empoderador', color: '#2E8B57', ink: '#2E8B57', fg: '#FFFFFF', chip: 'rgba(0,0,0,.18)',\n    tagline: 'Desarrollas a las personas y construyes acuerdos.',\n    summary: n => `${n} escucha antes de opinar, delega con confianza y se ocupa de que docentes y estudiantes crezcan. Su liderazgo se mide en el desarrollo de otros.`,\n    strengths: ['Escucha activa y empatía', 'Delegación que forma nuevos líderes', 'Clima de confianza en el equipo'],\n    blind: ['Puede evitar conversaciones difíciles', 'Buscar consenso puede alargar las decisiones'],\n    tip: 'Agenda esta semana una conversación de retroalimentación pendiente: sé claro con la expectativa y generoso con el apoyo.' },\n  { key: 'azul', name: 'Azul Analítico', short: 'Analítico', color: '#2F6DB5', ink: '#2F6DB5', fg: '#FFFFFF', chip: 'rgba(0,0,0,.18)',\n    tagline: 'Decides con evidencia y construyes procesos sólidos.',\n    summary: n => `${n} se apoya en datos, indicadores y procedimientos. Cuida la calidad académica y anticipa riesgos antes de que se conviertan en problemas.`,\n    strengths: ['Rigor en el análisis y la planeación', 'Procesos claros y documentados', 'Atención al detalle y a la calidad'],\n    blind: ['Puede retrasar decisiones esperando más información', 'Los cambios rápidos le generan resistencia'],\n    tip: 'Define de antemano qué información es suficiente; cuando la tengas, decide y ajusta sobre la marcha.' }\n];\n// [code, enunciado, aspecto, isNegative, cardColor] — isNegative: \"En desacuerdo\" suma +1\nconst BANK = {\n  rojo: [\n    ['R1', 'Soy naturalmente muy competitivo con los demás y me impulsa ganar.', 'Enfocado en resultados', false, '#882329'],\n    ['R2', 'A veces soy tan directo e impaciente que termino hiriendo o molestando a la gente.', 'Enfocado en resultados', true, '#C9381E'],\n    ['R3', 'Me siento muy cómodo asumiendo el control y dirigiendo en situaciones de grupo.', 'Extrovertido', false, '#C9381E'],\n    ['R4', 'Me obsesiona tanto ganar que llego a pasar por alto las necesidades de los demás.', 'Enfocado en resultados', true, '#882329'],\n    ['R5', 'Disfruto siendo el centro de atención y expresando mi energía abiertamente.', 'Extrovertido', false, '#C9381E'],\n    ['R6', 'Mi necesidad de tener el mando resulta a menudo dominante y agobiante para mi entorno.', 'Extrovertido', true, '#C9381E'],\n    ['R7', 'Me conocen como alguien tenaz que no desiste hasta ver la meta cumplida.', 'Enfocado en resultados', false, '#882329'],\n    ['R8', 'Al debatir un punto, los demás a veces me perciben agresivo o inflexible.', 'Enfocado en resultados', true, '#882329'],\n    ['R9', 'Disfruto evaluando críticamente las ideas y sosteniendo debates exigentes.', 'Enfocado en resultados', false, '#D66B24'],\n    ['R10', 'A veces presiono mis opiniones de forma tan vehemente que anulo las posturas ajenas.', 'Extrovertido', true, '#C9381E'],\n    ['R11', 'Me esfuerzo constantemente por superar el rendimiento de mis colegas.', 'Enfocado en resultados', false, '#882329'],\n    ['R12', 'Mi nivel de entusiasmo y volumen de energía llega a abrumar o agotar a quienes me rodean.', 'Extrovertido', true, '#C9381E'],\n    ['R13', 'Soy un negociador duro que prioriza alcanzar el objetivo planteado.', 'Enfocado en resultados', false, '#882329']\n  ],\n  azul: [\n    ['A1', 'Cuando trabajo en una tarea soy sumamente estructurado y metódico.', 'Disciplinado', false, '#7B3060'],\n    ['A2', 'Pierdo tanto tiempo organizando y detallando que me cuesta pasar a la acción.', 'Disciplinado', true, '#7B3060'],\n    ['A3', 'Es fundamental para mí verificar y contrastar todos los hechos antes de decidir.', 'Aterrizado', false, '#2F4A96'],\n    ['A4', 'Mi necesidad de ser objetivo me hace parecer una persona fría o distante ante los demás.', 'Aterrizado', true, '#1B3B87'],\n    ['A5', 'Creo firmemente en cumplir siempre mis compromisos y plazos establecidos.', 'Disciplinado', false, '#7B3060'],\n    ['A6', 'Me vuelvo tan rígido con los métodos tradicionales que me resisto a cualquier cambio necesario.', 'Aterrizado', true, '#215CAE'],\n    ['A7', 'La atención minuciosa al detalle y la precisión es una de mis fortalezas clave.', 'Disciplinado', false, '#7B3060'],\n    ['A8', 'A veces me pierdo en los detalles minuciosos y pierdo la visión del panorama general.', 'Disciplinado', true, '#7B3060'],\n    ['A9', 'Evito teorizar y me enfoco en lo concreto, práctico y verificable.', 'Aterrizado', false, '#1B3B87'],\n    ['A10', 'Mi afán por la exactitud y la precisión puede volverse excesivo y retrasar las entregas.', 'Disciplinado', true, '#7B3060'],\n    ['A11', 'Analizo las situaciones de manera lógica y racional sin involucrar emociones.', 'Aterrizado', false, '#2F4A96'],\n    ['A12', 'Soy tan realista y estricto con los datos que cierro el paso a explorar hipótesis creativas.', 'Aterrizado', true, '#1B3B87'],\n    ['A13', 'Manejo bien y con paciencia las tareas repetitivas que demandan gran rigor técnico.', 'Disciplinado', false, '#7B3060']\n  ],\n  amarillo: [\n    ['Y1', 'Soy naturalmente inclinado a pensar en el panorama global e identificar patrones.', 'Pensador de panorama global', false, '#D66B24'],\n    ['Y2', 'Me pierdo tanto en la imaginación y las teorías que descuido la viabilidad real.', 'Pensador de panorama global', true, '#D66B24'],\n    ['Y3', 'Tiendo a mantener mis planes informales para tener abiertas todas mis opciones.', 'Inspirado', false, '#B6BE34'],\n    ['Y4', 'Mi falta de planeación y orden me causa retrasos o incumplimiento de fechas límite.', 'Inspirado', true, '#B6BE34'],\n    ['Y5', 'Disfruto profundamente siendo una fuente constante de ideas disruptivas.', 'Pensador de panorama global', false, '#D66B24'],\n    ['Y6', 'A menudo propongo o inicio cambios solo por aburrimiento, sin que exista una necesidad real.', 'Pensador de panorama global', true, '#D66B24'],\n    ['Y7', 'No creo que la tradición o la costumbre deba interponerse ante un cambio conveniente.', 'Pensador de panorama global', false, '#D66B24'],\n    ['Y8', 'Puedo ser tan adaptable y cambiar de rumbo con tanta facilidad que pierdo el foco original.', 'Inspirado', true, '#B6BE34'],\n    ['Y9', 'Disfruto trabajar en entornos flexibles donde las ideas fluyan sin objetivos rígidos.', 'Inspirado', false, '#B6BE34'],\n    ['Y10', 'A veces complico innecesariamente problemas que admitían una solución directa y sencilla.', 'Pensador de panorama global', true, '#D66B24'],\n    ['Y11', 'Me entusiasma improvisar soluciones espontáneas cuando el contexto cambia repentinamente.', 'Inspirado', false, '#B6BE34'],\n    ['Y12', 'Ha habido ocasiones en que he actuado por mero impulso y después he lamentado no reflexionar.', 'Inspirado', true, '#B6BE34']\n  ],\n  verde: [\n    ['G1', 'Soy naturalmente muy empático y comprendo el punto de vista ajeno.', 'Enfocado en las personas', false, '#4B7C37'],\n    ['G2', \"Por complacer a los demás y evitar roces, me cuesta muchísimo decir 'no' o poner límites.\", 'Enfocado en las personas', true, '#4B7C37'],\n    ['G3', 'Me gusta escu .cos(rad(a))).toFixed(1)} ${(150 + r * Math.sin(rad(a))).toFixed(1)}`;\n      return `M150 150 L${p(a1)} A${r} ${r} 0 0 1 ${p(a2)} Z`;\n    };\n    const angles = [180, 270, 0, 90];\n    const pos = ['top:0;left:0', 'top:0;right:0', 'bottom:0;right:0', 'bottom:0;left:0'];\n    const d = STYLES[st.detail];\n    const detailBg = st.screen === 'detail' ? d.color : null;\n    const sheetsUrl = this.props.sheetsUrl;\n    const panelRows = () => { const sel = st.panelGroup; return (st.rows || []).filter(r => sel === 'TODOS' || r.group === sel); };\n    let panel = { sel: 'TODOS', groups: [], styleRows: [], last: [], n: 0, nLabel: 'participantes', hasLast: false };\n    if (st.screen === 'panel') {\n      const all = st.rows || [];\n      const groups = ['TODOS', ...[...new Set(all.map(r => r.group))].sort()];\n      const sel = groups.includes(st.panelGroup) ? st.panelGroup : 'TODOS';\n      const rs = all.filter(r => sel === 'TODOS' || r.group === sel), n = rs.length;\n      const avg = k => n ? Math.round(rs.reduce((a, r) => a + (+r[k] || 0), 0) / n) : 0;\n      const shortOf = nm => (STYLES.find(x => x.name === nm) || {}).short || nm;\n      const fmt = ts => { const dt = new Date(ts); return isNaN(dt) ? '' : dt.toLocaleString('es-MX', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };\n      panel = {\n        sel, groups: groups.map(g => ({ g })), n, nLabel: n === 1 ? 'participante' : 'participantes',\n        styleRows: STYLES.map(s => ({ name: s.name, color: s.color, avg: avg(s.key), hi: rs.filter(r => r.top === s.name).length, lo: rs.filter(r => r.bottom === s.name).length })),\n        last: [...rs].sort((a, b) => String(b.ts).localeCompare(String(a.ts))).slice(0, 6).map(r => ({ when: fmt(r.ts), group: r.group, top: shortOf(r.top), bottom: shortOf(r.bottom) })), hasLast: n > 0\n      };\n    }\n    const pending = sheetsUrl ? (st.rows || []).filter(r => r.synced === false).length : 0;\n\n    return {\n      styles: STYLES, total: QUESTION
